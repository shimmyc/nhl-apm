name: Daily update

on:
  schedule:
    # 11:00 UTC daily. That is 06:00 Central while the US is on CDT and 05:00
    # once CST begins in November -- either way it lands after late West Coast
    # games have gone final. GitHub's scheduler is best-effort and can run
    # late under load; the job is idempotent, so a missed slot self-heals.
    - cron: "0 11 * * *"
  workflow_dispatch:

# Never let two runs write the cache or docs/ at once.
concurrency:
  group: nhl-apm-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the tool is standard library only.

      - name: Fetch new games and compute
        run: python main.py --quiet-fetch

      - name: Verify (publish gate)
        # Exits non-zero if any TOI or plus-minus check fails. The job stops
        # here, docs/ is left exactly as published, and GitHub emails the
        # failure.
        run: python verify.py

      - name: Build the page
        # update.py re-runs the gate itself before writing, so the published
        # page can only ever come from a verified run.
        run: python update.py

      - name: Commit cache and page
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache docs ./*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase in case a manual run landed first.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### nhl-apm daily update"
            echo ""
            if [ -f docs/index.html ]; then
              echo "- Page: \`docs/index.html\` ($(wc -c < docs/index.html) bytes)"
            fi
            echo "- Cached files: $(ls cache | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
