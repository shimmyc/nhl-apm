name: Daily update

on:
  schedule:
    # 11:00 UTC daily. That is 06:00 Central while the US is on CDT and 05:00
    # once CST begins in November -- either way it lands after late West Coast
    # games have gone final. GitHub's scheduler is best-effort and can run
    # late under load; the job is idempotent, so a missed slot self-heals.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Recompute every game instead of reusing docs/data (refetches anything not in the raw cache)"
        type: boolean
        default: false

# Never let two runs write the cache or docs/ at once.
concurrency:
  group: nhl-apm-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets the job save the raw-response cache

jobs:
  update:
    runs-on: ubuntu-latest
    # A cold full-season backfill is ~4,000 requests at ~1/sec. The raw cache
    # is saved even if a run dies, so a timed-out backfill resumes next run.
    timeout-minutes: 240

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the tool is standard library only.

      # The season is never hard-coded: the newest season whose regular season
      # has started, per the NHL's own season table. The run rolls into a new
      # season on its opening day, and the cache key follows it.
      - name: Detect the current season
        id: season
        run: python -m nhlapm.seasons --github-output

      # The raw API cache (~0.5 MB a game, ~650 MB a season) is not committed.
      # It lives in the Actions cache. Keys are immutable, so each run saves
      # under its own id and restores the newest by prefix.
      - name: Restore raw API cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: nhl-raw-${{ steps.season.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            nhl-raw-${{ steps.season.outputs.id }}-

      - name: Fetch, verify and build
        id: update
        # Per-game failures are quarantined and listed on the page. The step
        # fails -- leaving docs/ exactly as published -- only for systemic
        # problems: more than max(5, 2%) of games failing or a league-level identity breaking.
        run: python update.py --quiet --season ${{ steps.season.outputs.id }} ${{ inputs.rebuild && '--rebuild' || '' }}

      - name: Save raw API cache
        if: always() && steps.update.outputs.fetched != '0'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: nhl-raw-${{ steps.season.outputs.id }}-${{ github.run_id }}

      - name: Commit processed data and page
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs ./*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase in case a manual run landed first.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### nhl-apm daily update"
            echo ""
            for f in docs/data/*.json docs/index.html; do
              [ -f "$f" ] && echo "- \`$f\`: $(wc -c < "$f") bytes, $(gzip -c "$f" | wc -c) gzipped"
            done
            echo "- Raw cache files: $(ls cache 2>/dev/null | wc -l), $(du -sh cache 2>/dev/null | cut -f1)"
            echo "- Requests this run: ${{ steps.update.outputs.fetched }}"
          } >> "$GITHUB_STEP_SUMMARY"
