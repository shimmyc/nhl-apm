<style>

:root {

@media (prefers-color-scheme: dark) {

  color-scheme: dark;

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);

main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 32px 0 8px; }
p.lede, p.note { color: var(--text-secondary); margin: 0 0 16px; max-width: 72ch; }
.filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding: 12px 0 4px; position: sticky; top: 0; background: var(--page); z-index: 2; }
@media (max-width: 600px) { .filters { position: static; } }
.filters label { color: var(--text-secondary); font-size: 13px; }
.filters select { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin-left: 6px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 14px 10px; min-width: 0; }
.card h3 { font-size: 14px; margin: 0; font-weight: 600; }
.card .sub { color: var(--text-secondary); font-size: 12.5px; margin: 2px 0 6px;
  font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .axis-title { fill: var(--text-secondary); font-size: 11.5px; }
.dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.hit { fill: transparent; cursor: pointer; }
.hit:hover + .dot, .hit:focus + .dot { stroke: var(--text-primary); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 12.5px; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums;
  width: 100%; margin-top: 6px; }
th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; }
.scroll { overflow-x: auto; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12.5px;
  box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; z-index: 5;
  font-variant-numeric: tabular-nums; }
#tip strong { display: block; font-size: 13.5px; }
#tip span { color: var(--text-secondary); }
.key { display: flex; gap: 18px; flex-wrap: wrap; color: var(--text-secondary); font-size: 12.5px;
  margin: 4px 0 12px; align-items: center; }
.key i { display: inline-block; vertical-align: middle; margin-right: 6px; }

.filters input[type=search] { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; margin-left: 6px; width: 12em; }
.filters input[type=checkbox] { margin: 0 6px 0 0; vertical-align: -2px; }
th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
th.sort[aria-sort]::after { content: " \25BE"; }
th.sort[aria-sort="ascending"]::after { content: " \25B4"; }
td.name { white-space: nowrap; font-weight: 600; }
td.flagcell { text-align: left; color: var(--text-secondary); min-width: 12em; }
.badge { display: inline-block; border: 1px solid var(--border); border-radius: 999px;
  padding: 0 7px; font-size: 11.5px; color: var(--text-primary); white-space: nowrap; margin: 1px 4px 1px 0; }
.badge::before { content: "\2691\00a0"; color: var(--text-secondary); }
#proj td, #edges td, #proj th, #edges th { white-space: nowrap; }
th.left, td.left { text-align: left; }
#proj td.name, #proj th:first-child, #edges td.name, #edges th:first-child { position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
.barcell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.barcell span.val { min-width: 2.6em; text-align: right; }
.barcell span.track { width: 60px; height: 6px; display: inline-flex; }
.barcell span.bar { height: 6px; background: var(--series-1); border-radius: 0 3px 3px 0; }
tr.missed td { color: var(--text-secondary); }
.empty { color: var(--text-secondary); padding: 10px 0; }
.games { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.games span { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 9px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
</style>

for (const g of S.games) {

  const o = document.createElement("option"); o.value = g.game_id; o.textContent = `${g.away} @ ${g.home}`;
  $("f-game").appendChild(o);
}

function badges(td, flags) {
  for (const f of flags) { const b = document.createElement("span"); b.className = "badge"; b.textContent = f; td.appendChild(b); }
}

function table(host, cols, rows, sortKey, desc, rowClass) {
  host.replaceChildren();
  if (!rows.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = "Nothing to show."; host.appendChild(p); return; }
  const t = document.createElement("table");
  const head = t.createTHead().insertRow();
  for (const c of cols) {
    const th = document.createElement("th"); th.textContent = c.label;
    if (c.left) th.classList.add("left");
    if (c.sort) {
      th.classList.add("sort"); th.tabIndex = 0;
      if (c.key === sortKey) th.setAttribute("aria-sort", desc ? "descending" : "ascending");
      const go = () => table(host, cols, rows, c.key, c.key === sortKey ? !desc : c.desc !== false, rowClass);
      th.addEventListener("click", go);
      th.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    }
    head.appendChild(th);
  }
  const col = cols.find(c => c.key === sortKey);
  const val = col && col.sortVal ? col.sortVal : (r) => r[sortKey];
  const sorted = [...rows].sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * (desc ? -1 : 1); });
  const body = t.createTBody();
  for (const r of sorted) {
    const tr = body.insertRow();
    if (rowClass) tr.className = rowClass(r);
    for (const c of cols) { const td = tr.insertCell(); c.cell(td, r); if (c.left) td.classList.add("left"); }
  }
  host.appendChild(t);
}

const text = (f) => (td, r) => { td.textContent = f(r); };
const maxExp = Math.max(1, ...S.rows.map(r => r.expected));

function filtered(rows) {
  const g = $("f-game").value, q = $("f-name").value.trim().toLowerCase(), hide = $("f-hide").checked;
  return rows.filter(r => (!g || String(r.game_id) === g) && (!q || r.player.toLowerCase().includes(q)) && (!hide || !(r.flags && r.flags.length)));
}

function draw() {

    { label: "Player", key: "player", sort: true, desc: false, cell: (td, r) => { td.className = "name"; td.textContent = r.player; } },
    { label: "Team", key: "team", left: true, sort: true, desc: false, cell: text(r => r.team + (r.home ? " (home)" : "")) },
    { label: "Opp", key: "opp", left: true, sort: true, desc: false, cell: text(r => r.opp) },
    { label: "Start", key: "start_utc", sort: true, desc: false, cell: text(r => ct(r.start_utc)) },
    { label: "Proj SOG", key: "expected", sort: true, cell: (td, r) => {
        td.className = "barcell";
        const v = document.createElement("span"); v.className = "val"; v.textContent = r.expected.toFixed(2);
        const track = document.createElement("span"); track.className = "track";
        const bar = document.createElement("span"); bar.className = "bar"; bar.style.width = Math.round(r.expected / maxExp * 60) + "px";
        track.appendChild(bar); td.append(v, track); } },
    { label: "P > 1.5", key: "p15", sort: true, cell: text(r => pct(r.p15)) },

    { label: "P > 3.5", key: "p35", sort: true, cell: text(r => pct(r.p35)) },
    { label: "EV TOI", key: "ev_toi", sort: true, cell: text(r => r.ev_toi.toFixed(1)) },
    { label: "PP TOI", key: "pp_toi", sort: true, cell: text(r => r.pp_toi.toFixed(2)) },
    { label: "Opp ×", key: "opp_mult", sort: true, cell: text(r => r.opp_mult.toFixed(3)) },
    { label: "Flags", key: "flags", left: true, cell: (td, r) => { td.className = "flagcell"; badges(td, r.flags); } },
  ];
  table($("proj"), projCols, filtered(S.rows), "expected", true, r => r.status === "lineup" ? "" : "missed");

      (S.notes.length ? " " + S.notes.join(" ") : "");
  }
  const edgeRows = filtered(S.edges.map(e => ({ ...e, flags: [e.flag ? "unvalidated: edge > 5 pts" : "", ...(e.flags ? e.flags.split("; ") : [])].filter(Boolean) })));
  const price = (p) => p === "" ? "" : (p > 0 ? "+" + p : String(p));
  table($("edges"), [
    { label: "Player", key: "player", sort: true, desc: false, cell: (td, r) => { td.className = "name"; td.textContent = r.player; } },
    { label: "Team", key: "team", left: true, sort: true, desc: false, cell: text(r => r.team) },
    { label: "Line", key: "line", sort: true, cell: text(r => r.line) },
    { label: "Side", key: "side", left: true, sort: true, desc: false, cell: text(r => r.side) },
    { label: "Edge", key: "edge", sort: true, cell: text(r => "+" + (r.edge * 100).toFixed(1) + " pts") },
    { label: "Model P(over)", key: "model_over", sort: true, cell: text(r => pct(r.model_over)) },
    { label: "Fair P(over)", key: "fair_over", sort: true, cell: text(r => pct(r.fair_over)) },
    { label: "Best price", key: "best_price", left: true, cell: text(r => price(r.best_price) + (r.best_book ? " " + r.best_book : "")) },
    { label: "Over / Under (best)", key: "over_price", left: true, cell: text(r => price(r.over_price) + " / " + price(r.under_price)) },
    { label: "Books", key: "books", sort: true, cell: text(r => r.books) },
    { label: "Proj SOG", key: "expected", sort: true, cell: text(r => r.expected.toFixed(2)) },
    { label: "Flags", key: "flags", left: true, cell: (td, r) => { td.className = "flagcell"; badges(td, r.flags); } },
  ], edgeRows, "edge", true);
}

for (const id of ["f-game", "f-hide"]) $(id).addEventListener("change", draw);
let t; $("f-name").addEventListener("input", () => { clearTimeout(t); t = setTimeout(draw, 120); });
draw();
</script>
</body>
</html>
